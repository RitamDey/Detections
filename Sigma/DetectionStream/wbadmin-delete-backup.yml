title: Backups Deleted Via Wbadmin.EXE
id: e1aacfb9-aaf1-459c-8a2c-0e5a9342f7d8
description: Detects the deletion of backups via "wbadmin.exe".
status: test
author: lazarg
references: []
tags:
  - attack.impact
  - attack.t1490

# Solutin starts here
logsource:
  category: process_creation
  product: windows
  service: sysmon
detection:
  commandline:
    OriginalFileName: "WBADMIN.EXE"
    CommandLine|contains: "DELETE"
  targets:
    CommandLine|contains:
      - " BACKUP "
      - " SYSTEMBACKUP "
      - " CATALOG "
  condition: commandline and targets
# Solution ends here

falsepositives:
  - Unknown
level: high
